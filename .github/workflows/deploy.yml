name: Deploy betagsf.sreeb.dev

# Push to main -> rsync the site to Hostinger over SSH.
# Only site files are shipped; repo-only files are excluded so they never
# exist on the server at all. .htaccess denies them as a second layer in
# case they ever arrive by another route (e.g. a manual git pull on the box).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-betagsf
  cancel-in-progress: true

env:
  SSH_HOST: 145.79.58.193
  SSH_PORT: "65002"
  SSH_USER: u306132917
  REMOTE_PATH: domains/betagsf.sreeb.dev/public_html/

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if [ -n "${{ secrets.SSH_KNOWN_HOSTS }}" ]; then
            printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          else
            echo "::warning::SSH_KNOWN_HOSTS not set - trusting host key on first use"
            ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Show what will deploy
        run: git log --oneline -1

      - name: Rsync to Hostinger
        run: |
          rsync -az --delete --itemize-changes \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.gitignore' \
            --exclude 'README.md' \
            --exclude 'DEPLOY.md' \
            --exclude 'fetch-live-images.sh' \
            --exclude 'assets/img/live/' \
            -e "ssh -p $SSH_PORT -i $HOME/.ssh/id_ed25519 -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes -o PreferredAuthentications=publickey -o BatchMode=yes" \
            ./ "$SSH_USER@$SSH_HOST:$REMOTE_PATH"

      - name: Verify live
        env:
          BETA_AUTH: ${{ secrets.BETA_BASIC_AUTH }}
        run: |
          sleep 3
          fail=0
          code() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          # $2 may list several acceptable codes, space separated.
          check() {
            c=$(code "https://betagsf.sreeb.dev$1")
            for want in $2; do
              if [ "$c" = "$want" ]; then echo "ok   $1 -> $c"; return; fi
            done
            echo "FAIL $1 -> $c (expected one of: $2)"; fail=1
          }
          # The beta sits behind HTTP basic auth, so an unauthenticated request
          # must be 401. That is the proof the gate is live - including for
          # images, which no noindex layer reaches on this host.
          # Basic auth is temporarily disabled, so these answer 200 not 401.
          # Accept either, so the run stays honest whichever state it is in.
          check /                              "200 401"
          check /assets/img/academy-cohort.jpg "200 401"
          check /robots.txt                    "200 401"
          # The deny rules outrank Require valid-user, so these answer before
          # the auth challenge and stay 403/404 with or without credentials.
          check /README.md                     403
          # .git and .github are denied by RedirectMatch, but when the path
          # exists on disk the server answers 403 before the redirect fires.
          # Either code is a denial; which one shows depends on whether a
          # previous manual git-pull deploy left the directory there.
          check /.git/config                   "404 403"
          check /.github/workflows/deploy.yml  "404 403"
          # Content checks need credentials. Optional: set repo secret
          # BETA_BASIC_AUTH to "user:password" to enable them.
          if [ -n "$BETA_AUTH" ]; then
            for p in / /assets/img/academy-cohort.jpg; do
              c=$(code -u "$BETA_AUTH" "https://betagsf.sreeb.dev$p")
              if [ "$c" = "200" ]; then echo "ok   $p -> 200 (authenticated)"
              else echo "FAIL $p -> $c authenticated (expected 200)"; fail=1; fi
            done
          else
            echo "::notice::BETA_BASIC_AUTH not set - authenticated content checks skipped"
          fi
          exit $fail
